# SonarQube analysis settings (read by sonar-scanner in the Jenkins pipeline)
sonar.projectKey=travel-app
sonar.projectName=Travel App

# Application code to analyse
sonar.sources=backend/app,frontend/src
# Test files are not "code to judge" - list them separately / exclude them
sonar.tests=backend/tests
sonar.exclusions=frontend/src/**/*.test.*,frontend/src/test/**

sonar.python.version=3.12
# Coverage report produced by pytest in the backend test stage
sonar.python.coverage.reportPaths=backend/coverage.xml
